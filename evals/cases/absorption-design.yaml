# Absorption cases for the 5 design/content skills that previously had no coverage:
# anti-slop, design-taste-frontend, design-brutalist, design-minimalist, design-redesign.
# Each assertion targets a CONCRETE rule the skill teaches that the base model tends to
# violate by default (Inter, AI-purple gradients, h-screen, "Elevate", window.alert, etc.),
# so a positive absorption delta means the skill actually changed behavior.
# Patterns are compiled with the "im" flags (case-insensitive) — no need for (?i).
cases:
  # ══════════════════════════════════
  # ANTI-SLOP  (user-facing copy)
  # ══════════════════════════════════
  # NOTE: anti-slop's primary mechanism is INJECTING ANTI_SLOP_PROMPT_RULES into a
  # generation system prompt, which an absorption eval (load-as-context) cannot fully
  # measure. These cases use long, open briefs that tempt the base model toward the
  # subtler tells (rhetorical-question openers, em-dash overuse, bumper-sticker closes)
  # where retrieved knowledge can still move the needle.
  - id: abs-slop-001
    skill: anti-slop
    task: >
      Write a ~150-word 'About Us' section for a B2B analytics product that helps finance
      teams close the books faster. Engaging, marketing-style prose.
    assertions:
      - pattern: "(ever wondered|what if|imagine a|picture this|let'?s face it|here'?s the thing|in a world)"
        expect: absent
        description: "No rhetorical-question / 'imagine a world' opener crime"
      - pattern: "—[^—\\n]{1,80}—[^—\\n]{1,80}—"
        expect: absent
        description: "No em-dash overuse (3+ em-dashes signalling AI cadence)"
      - pattern: "it'?s not just .{1,40}? it'?s|isn'?t just .{1,40}? it'?s"
        expect: absent
        description: "No 'it's not just X, it's Y' bumper-sticker construction"

  - id: abs-slop-002
    skill: anti-slop
    task: >
      Write a ~120-word blog post introduction about improving remote-team productivity.
      Make it compelling.
    assertions:
      - pattern: "\\b(in the world of|when it comes to|at the end of the day|that said|look no further|the truth is|let'?s be honest)\\b"
        expect: absent
        description: "Avoids filler clichés"
      - pattern: "\\b(studies show|research shows|experts agree|\\d{2,3}% of (people|teams|workers|companies))\\b"
        expect: absent
        description: "No unsourced authority/stat ('studies show', vague %)"
      - pattern: "\\b(synergy|leverage our|best.?in.?class|next.?gen|paradigm|supercharge)\\b"
        expect: absent
        description: "Avoids corporate jargon"

  # ══════════════════════════════════
  # DESIGN-TASTE-FRONTEND  (premium React/Tailwind UI)
  # ══════════════════════════════════
  - id: abs-taste-001
    skill: design-taste-frontend
    task: >
      Build a marketing hero section as a React + Tailwind component (full source). Full-height,
      with a headline, subhead, and a primary CTA.
    assertions:
      - pattern: "h-screen"
        expect: absent
        description: "Uses min-h-[100dvh], not h-screen (mobile viewport stability)"
      - pattern: "from-purple|to-pink|via-purple|indigo-500.*purple|purple-500.*pink"
        expect: absent
        description: "No banned AI-purple / neon gradient (the LILA ban)"
      - pattern: "min-h-\\[100dvh\\]"
        expect: present
        description: "Applies the dvh full-height rule"

  - id: abs-taste-002
    skill: design-taste-frontend
    task: >
      Build a high-density SaaS dashboard metrics panel as a React + Tailwind component showing
      four numeric KPIs with deltas. Full source.
    assertions:
      - pattern: "font-mono"
        expect: present
        description: "Numbers use monospace (cockpit-mode rule)"
      - pattern: "\\bInter\\b"
        expect: absent
        description: "Avoids Inter; uses Geist/Satoshi-class fonts"
      - pattern: "w-\\[calc\\("
        expect: absent
        description: "Uses CSS Grid, not flexbox percentage math"

  # ══════════════════════════════════
  # DESIGN-BRUTALIST  (industrial / tactical terminal UI)
  # ══════════════════════════════════
  - id: abs-brutal-001
    skill: design-brutalist
    task: >
      Design a tactical telemetry dashboard panel in an industrial-brutalist style. Provide the
      component markup and CSS/Tailwind.
    assertions:
      - pattern: "uppercase|text-transform:\\s*uppercase"
        expect: present
        description: "Uses uppercase structural typography"
      - pattern: "font-mono|monospace|JetBrains Mono|IBM Plex Mono|Space Mono"
        expect: present
        description: "Dominant monospaced typography"
      - pattern: "rounded-(xl|2xl|3xl|full)|shadow-(lg|xl|2xl)|backdrop-blur"
        expect: absent
        description: "No soft radii, soft shadows, or translucency (brutalist sharpness)"

  - id: abs-brutal-002
    skill: design-brutalist
    task: >
      Build a brutalist 'Swiss print' landing hero with oversized type. Provide markup and
      CSS/Tailwind.
    assertions:
      - pattern: "display:\\s*grid|grid-template|grid-cols-"
        expect: present
        description: "Anchored CSS Grid (blueprint grid), not floated layout"
      - pattern: "uppercase|text-transform:\\s*uppercase"
        expect: present
        description: "Uppercase macro-typography"
      - pattern: "#000000|#000\\b"
        expect: absent
        description: "Avoids pure black (use #0A0A0A / #121212 deactivated-CRT base)"

  # ══════════════════════════════════
  # DESIGN-MINIMALIST  (editorial / Notion-style UI)
  # ══════════════════════════════════
  - id: abs-min-001
    skill: design-minimalist
    task: >
      Build a SaaS pricing section with three plan cards as a React + Tailwind component.
      Full source. (Pricing cards are where the base model reaches for heavy shadows,
      bold gradients, and pill buttons — the minimalist skill should suppress all three.)
    assertions:
      - pattern: "\\bshadow-(md|lg|xl|2xl)\\b"
        expect: absent
        description: "No heavy drop shadows (shadows must be near-invisible)"
      - pattern: "bg-gradient|linear-gradient"
        expect: absent
        description: "No gradient fills on cards/CTAs"
      - pattern: "rounded-full|rounded-3xl"
        expect: absent
        description: "No pill / oversized-radius shapes on cards or buttons"

  - id: abs-min-002
    skill: design-minimalist
    task: >
      Build an editorial marketing hero (warm-monochrome, document-style) as a React + Tailwind
      component with a serif headline. Full source.
    assertions:
      - pattern: "\\b(Elevate|Seamless|Unleash|Next.?Gen|Game.?changer|Delve)\\b"
        expect: absent
        description: "Avoids AI copywriting clichés"
      - pattern: "linear-gradient|neon|glassmorphism"
        expect: absent
        description: "No gradients / neon / glassmorphism"
      - pattern: "letter-spacing:\\s*-0\\.0[234]em|tracking-tight|tracking-tighter"
        expect: present
        description: "Tight tracking on the editorial serif heading"

  # ══════════════════════════════════
  # DESIGN-REDESIGN  (audit & upgrade existing generic-AI UI)
  # ══════════════════════════════════
  - id: abs-redesign-001
    skill: design-redesign
    task: >
      Redesign this hero to look premium, keeping React + Tailwind. Return the upgraded component:
      <section class="min-h-screen flex items-center justify-center bg-gradient-to-r from-purple-500 to-pink-500" style="font-family: Inter">
        <h1 class="text-center">Elevate Your Workflow</h1>
      </section>
    assertions:
      - pattern: "from-purple|to-pink|purple-500|gradient-to-r from-purple"
        expect: absent
        description: "Removes the AI-purple gradient fingerprint"
      - pattern: "font-family:\\s*Inter|\\bInter\\b"
        expect: absent
        description: "Replaces Inter with a font with character"
      - pattern: "\\b(Elevate|Seamless|Unleash|Delve|Tapestry)\\b"
        expect: absent
        description: "Rewrites the cliché headline copy"

  # The base model already fixes problems you NAME explicitly, so this case hands it a
  # generic component WITHOUT flagging what's wrong and asks only for "premium" — the AI
  # tells (Inter, heavy shadow, centered) must be removed on the skill's own judgment.
  - id: abs-redesign-002
    skill: design-redesign
    task: >
      Make this dashboard stat card look premium, keeping React + Tailwind. Return the
      upgraded component:
      <div class="shadow-xl rounded-2xl text-center p-8" style="font-family: Inter">
        <p class="text-sm">Total Revenue</p><h2 class="text-4xl">$48,200</h2>
      </div>
    assertions:
      - pattern: "shadow-xl|shadow-2xl"
        expect: absent
        description: "Removes the heavy generic drop shadow"
      - pattern: "font-family:\\s*Inter|\\bInter\\b"
        expect: absent
        description: "Replaces Inter with a font with character"
      - pattern: "tabular-nums|font-mono"
        expect: present
        description: "Uses tabular/monospace figures for the metric (data-display rule)"
